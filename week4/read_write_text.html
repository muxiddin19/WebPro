<!DOCTYPE html>
<html>
<body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; padding: 20px;">
    <h1 id="msg">Original text</h1>
    <input id="inp" type="text" placeholder="Type text here ..." style="padding:8px; font-size: 16px; width: 200px;">
    <button onclick="changeText()" style="padding: 8px 16px; margin-left:8px; cursor:pointer;">Change Text</button>   
    <script>
        function changeText() {
            const newText = document.getElementById('inp').value;
            document.getElementById('msg').textContent = "Original text: ==>" + newText + " (changed)";
        }
    </script>
    </body>
</html>
